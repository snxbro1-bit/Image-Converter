<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Image Converter - Free Tools Zone</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
  padding:25px 15px;
}

.container{
  max-width:1050px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.header h1{
  font-size:36px;
  margin-bottom:8px;
}

.header p{
  color:#687386;
  font-size:16px;
}

.tool{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 35px rgba(0,0,0,.08);
}

.upload{
  display:block;
  border:2px dashed #aeb8c8;
  border-radius:16px;
  padding:45px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
  background:#fafcff;
}

.upload:hover{
  border-color:#5064ff;
  background:#f5f7ff;
}

.upload-icon{
  font-size:48px;
  margin-bottom:10px;
}

.upload h2{
  font-size:21px;
  margin-bottom:7px;
}

.upload p{
  color:#7a8494;
  font-size:14px;
  margin:4px;
}

#fileInput{
  display:none;
}

.settings{
  margin-top:22px;
  background:#f7f9fc;
  border-radius:14px;
  padding:20px;
}

.settings label{
  display:block;
  font-weight:bold;
  margin-bottom:9px;
  font-size:14px;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #d5dce7;
  border-radius:9px;
  font-size:15px;
  background:white;
}

.quality{
  margin-top:18px;
}

.quality-value{
  font-weight:bold;
  margin-left:5px;
}

input[type="range"]{
  width:100%;
  margin-top:10px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.btn{
  flex:1;
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.convertBtn{
  background:#5064ff;
  color:white;
}

.clearBtn{
  background:#edf0f5;
  color:#293241;
}

.results{
  margin-top:25px;
  display:grid;
  gap:15px;
}

.card{
  border:1px solid #e1e6ef;
  border-radius:15px;
  padding:15px;
  background:white;
}

.card-top{
  display:flex;
  gap:15px;
  align-items:center;
}

.preview{
  width:140px;
  height:110px;
  border-radius:10px;
  background:#f1f3f7;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.preview img{
  max-width:100%;
  max-height:100%;
}

.info{
  flex:1;
}

.info h3{
  font-size:16px;
  margin-bottom:8px;
  word-break:break-word;
}

.info p{
  color:#687386;
  font-size:13px;
  margin:5px 0;
}

.download{
  margin-top:12px;
  background:#172033;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.download:hover{
  opacity:.9;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#8a94a5;
  font-size:13px;
  line-height:1.6;
}

@media(max-width:650px){

  .header h1{
    font-size:28px;
  }

  .tool{
    padding:17px;
  }

  .card-top{
    flex-direction:column;
    align-items:stretch;
  }

  .preview{
    width:100%;
    height:190px;
  }

  .actions{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🔄 Free Image Converter</h1>
    <p>Convert JPG, PNG and WebP images online for free.</p>
  </div>

  <div class="tool">

    <label class="upload" for="fileInput">

      <div class="upload-icon">🖼️</div>

      <h2>Upload Your Images</h2>

      <p>Click here or drag and drop your images</p>

      <p>JPG, JPEG, PNG and WebP supported</p>

    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/jpeg,image/png,image/webp"
      multiple
    >

    <div class="settings">

      <label for="format">
        Convert To
      </label>

      <select id="format">

        <option value="image/jpeg">
          JPG / JPEG
        </option>

        <option value="image/png">
          PNG
        </option>

        <option value="image/webp">
          WebP
        </option>

      </select>

      <div class="quality">

        <label>
          Quality:
          <span class="quality-value" id="qualityValue">
            90%
          </span>
        </label>

        <input
          type="range"
          id="quality"
          min="10"
          max="100"
          value="90"
        >

      </div>

    </div>

    <div class="actions">

      <button
        class="btn convertBtn"
        onclick="convertImages()">

        🔄 Convert Images

      </button>

      <button
        class="btn clearBtn"
        onclick="clearAll()">

        🗑️ Clear All

      </button>

    </div>

    <div id="results" class="results"></div>

  </div>

  <div class="footer">

    Free Tools Zone • Images are processed directly in your browser.
    <br>
    Your images are not uploaded to our server.

  </div>

</div>


<script>

let files = [];
let convertedFiles = [];

const fileInput =
  document.getElementById("fileInput");

const quality =
  document.getElementById("quality");

const qualityValue =
  document.getElementById("qualityValue");


quality.addEventListener("input",function(){

  qualityValue.textContent =
    this.value + "%";

});


fileInput.addEventListener("change",function(){

  files =
    Array.from(this.files);

  showFiles();

});


function showFiles(){

  const results =
    document.getElementById("results");

  results.innerHTML = "";

  files.forEach((file,index)=>{

    const url =
      URL.createObjectURL(file);

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="card-top">

        <div class="preview">
          <img src="${url}">
        </div>

        <div class="info">

          <h3>
            ${escapeHTML(file.name)}
          </h3>

          <p>
            Original format:
            ${getExtension(file.name).toUpperCase()}
          </p>

          <p>
            File size:
            ${formatBytes(file.size)}
          </p>

        </div>

      </div>

    `;

    results.appendChild(card);

  });

}


function convertImages(){

  if(files.length === 0){

    alert("Please upload at least one image.");

    return;

  }

  convertedFiles = [];

  const results =
    document.getElementById("results");

  results.innerHTML = "";

  let completed = 0;

  const outputFormat =
    document.getElementById("format").value;

  const outputQuality =
    parseInt(quality.value) / 100;


  files.forEach((file,index)=>{

    const reader =
      new FileReader();

    reader.onload = function(e){

      const img =
        new Image();

      img.onload = function(){

        const canvas =
          document.createElement("canvas");

        canvas.width =
          img.width;

        canvas.height =
          img.height;

        const ctx =
          canvas.getContext("2d");


        /*
          JPG does not support transparency.
          Add white background when converting
          transparent PNG/WebP to JPG.
        */

        if(outputFormat === "image/jpeg"){

          ctx.fillStyle = "#ffffff";

          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

        }


        ctx.drawImage(
          img,
          0,
          0
        );


        canvas.toBlob(function(blob){

          if(!blob){

            alert(
              "This image could not be converted."
            );

            return;

          }


          const newName =
            getConvertedName(
              file.name,
              outputFormat
            );


          convertedFiles.push({

            blob:blob,
            name:newName

          });


          const url =
            URL.createObjectURL(blob);


          const card =
            document.createElement("div");

          card.className = "card";


          card.innerHTML = `

            <div class="card-top">

              <div class="preview">
                <img src="${url}">
              </div>

              <div class="info">

                <h3>
                  ${escapeHTML(newName)}
                </h3>

                <p>
                  Original:
                  ${formatBytes(file.size)}
                </p>

                <p>
                  Converted:
                  ${formatBytes(blob.size)}
                </p>

                <p>
                  Dimensions:
                  ${img.width} × ${img.height}px
                </p>

                <button
                  class="download"
                  onclick="downloadFile(
                    '${url}',
                    '${newName}'
                  )">

                  ⬇️ Download

                </button>

              </div>

            </div>

          `;


          results.appendChild(card);


          completed++;


          if(completed === files.length){

            addDownloadAll();

          }


        },outputFormat,outputQuality);

      };


      img.src =
        e.target.result;

    };


    reader.readAsDataURL(file);

  });

}


function addDownloadAll(){

  const button =
    document.createElement("button");

  button.className =
    "btn convertBtn";

  button.style.marginTop =
    "15px";

  button.innerText =
    "📦 Download All";

  button.onclick =
    downloadAll;

  document
    .getElementById("results")
    .appendChild(button);

}


function downloadFile(url,name){

  const a =
    document.createElement("a");

  a.href =
    url;

  a.download =
    name;

  document.body.appendChild(a);

  a.click();

  a.remove();

}


function downloadAll(){

  convertedFiles.forEach(
    (item,index)=>{

      setTimeout(()=>{

        const url =
          URL.createObjectURL(
            item.blob
          );

        downloadFile(
          url,
          item.name
        );

        setTimeout(()=>{

          URL.revokeObjectURL(url);

        },1000);

      },index * 300);

    }
  );

}


function clearAll(){

  files = [];

  convertedFiles = [];

  fileInput.value = "";

  document
    .getElementById("results")
    .innerHTML = "";

}


function getConvertedName(
  name,
  format
){

  const base =
    name.substring(
      0,
      name.lastIndexOf(".")
    ) || name;


  let extension =
    "jpg";


  if(format === "image/png"){

    extension = "png";

  }


  if(format === "image/webp"){

    extension = "webp";

  }


  return (
    base +
    "-converted." +
    extension
  );

}


function getExtension(name){

  return (
    name.split(".").pop() ||
    ""
  );

}


function formatBytes(bytes){

  if(bytes === 0)
    return "0 Bytes";


  const sizes = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];


  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    parseFloat(
      (
        bytes /
        Math.pow(1024,i)
      ).toFixed(2)
    )
    +
    " " +
    sizes[i]
  );

}


function escapeHTML(str){

  return str.replace(
    /[&<>"']/g,
    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    }
  );

}

</script>

</body>
</html>
